name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q

  llm-optional-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional LLM integration
        run: python -m pip install -e ".[dev,llm]"
      - name: Verify published CWA production surface
        run: |
          python - <<'PY'
          import importlib.metadata
          from chatgpt_web_adapter import ChatGPTProductRuntime, assemble_product_runtime

          version = importlib.metadata.version("chatgpt-web-adapter")
          assert version.startswith("0.2."), version
          assert callable(assemble_product_runtime)
          assert ChatGPTProductRuntime.__name__ == "ChatGPTProductRuntime"
          print(f"chatgpt-web-adapter={version}")
          PY
      - name: Compile
        run: python -m compileall -q src
      - name: PR15 provider contract tests
        run: pytest -q tests/test_pr15_llm_provider.py tests/test_pr15_chatgpt_adapter.py

  youtube-optional-contract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install optional YouTube integration
        run: python -m pip install -e ".[dev,youtube]"
      - name: Verify Google publishing and analytics runtime imports
        run: |
          python - <<'PY'
          import importlib.metadata
          from google_auth_oauthlib.flow import InstalledAppFlow
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          print("google-api-python-client=" + importlib.metadata.version("google-api-python-client"))
          print("google-auth=" + importlib.metadata.version("google-auth"))
          assert callable(build)
          assert callable(MediaFileUpload)
          assert InstalledAppFlow.__name__ == "InstalledAppFlow"
          PY
      - name: Compile
        run: python -m compileall -q src
      - name: YouTube publishing and analytics contract tests
        run: |
          pytest -q \
            tests/test_pr28_youtube_publishing.py \
            tests/test_pr28_youtube_optional_runtime.py \
            tests/test_pr29_publish_declarations_v2.py \
            tests/test_pr29_youtube_declarations.py \
            tests/test_pr29_youtube_preflight_mapping.py \
            tests/test_pr29_publishing_storage_compat.py \
            tests/test_pr37_youtube_analytics.py \
            tests/test_pr37_youtube_analytics_hardening.py \
            tests/test_pr37_youtube_analytics_optional_runtime.py \
            tests/test_api_cli.py

  ffmpeg-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: FFmpeg integration tests
        run: |
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
          pytest -q \
            tests/test_ffmpeg_capabilities_and_probe.py \
            tests/test_ffmpeg_compiler.py \
            tests/test_ffmpeg_runner.py \
            tests/test_ffmpeg_integration.py \
            tests/test_hook_overlay_integration.py \
            tests/test_initial_template_pack_integration.py \
            tests/test_pr13_motion_integration.py \
            tests/test_pr14_audio_integration.py \
            tests/test_pr23_presentation_integration.py \
            tests/test_pr24_long_form_integration.py \
            tests/test_render_orchestration_integration.py \
            tests/test_api_ffmpeg_integration.py

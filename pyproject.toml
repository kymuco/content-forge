[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "content-forge"
version = "0.0.1"
description = "Local-first modular content production runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "segno>=1.6,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]
llm = [
  "chatgpt-web-adapter>=0.2,<0.3",
]
tts = [
  "qwen-tts>=0.1.1,<0.2",
]

[project.scripts]
content-forge-api = "content_forge.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"content_forge.templates" = ["assets/*"]
"content_forge.web" = ["static/*", "static/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["content_forge"]
branch = true
